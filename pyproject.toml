[project]
name = "jaxnasium"
version = "0.1.0"
description = "A lightweight utility library for reinforcement learning projects in JAX and Equinox."
readme = "README.md"
authors = [
    { name = "Koen Ponse", email = "k.ponse@liacs.leidenuniv.nl" }
]
requires-python = ">=3.11"
dependencies = [
    "create-rl-app>=0.1.0",
    "equinox>=0.12.2,!=0.13.3",
    "jax>=0.5.2,!=0.7.*,!=0.9.*",
]

[project.optional-dependencies]
algs = [
    "jax>=0.8.2",
    "distrax>=0.1.7",
    "optax>=0.2.5",
]
gpu = [
    "jax[cuda]"
]

# Environment suites:
brax = ["brax>=0.14.2"]
envpool = ["envpool>=1.2.5,!=1.2.6"]
factoriax = ["factoriax>=0.1.0"]
gymnasium = ["gymnasium>=1.1.0"]
gymnax = ["gymnax>=0.0.9"]
jaxmarl = ["jaxmarl>=0.2.0"]
jumanji = ["jumanji>=1.1.2"]
navix = ["navix>=0.7.4"]
octax = ["octax>=0.1.1", "opencv-python-headless>=4.10.0.84", "pillow>=10.0.0"]
pgx = ["pgx>=2.6.0"]
playground = ["playground>=0.2.0"]
xminigrid = ["xminigrid>=0.9.3"]
envs = [
    "jaxnasium[brax,envpool,factoriax,gymnasium,gymnax,jaxmarl,jumanji,navix,octax,pgx,playground,xminigrid]",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project.scripts]
jaxnasium = "create_rl_app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
    "pre-commit>=4.2.0",
    "tqdm>=4.67.1",
    "distrax>=0.1.7",
    "optax>=0.2.4",
    "mkdocs-material>=9.6.13",
    "mkdocstrings[python]>=0.29.1",
]
# Environment suites that are not on PyPI: included here for tests
ext-crax = ["crax"]
ext-extra-libs = ["chargax", "econojax", "rice_jax"]
ext-popjym = ["popjym"]
external = [
    { include-group = "ext-crax" },
    { include-group = "ext-extra-libs" },
    { include-group = "ext-popjym" },
]

[tool.uv.sources]
# Pinned to the commits last tested in CI.
popjym = { git = "https://github.com/FLAIROx/popjym", rev = "d7b23ba2ba663628c168897a914f1a0998643265" }
crax = { git = "https://github.com/TTomilin/CRAX", rev = "7c12acd8d183810ca896038a3e85d3fe06bece79" }
rice_jax = { git = "https://github.com/mila-iqia/climate-cooperation-competition", rev = "7c70e350292c0e361dfedc5fe0180239894db594", subdirectory = "rice_jax" }
chargax = { git = "https://github.com/ponseko/chargax", rev = "f3c9f26005162259bc880c81c72f49983b306e8e" }
econojax = { git = "https://github.com/ponseko/econojax", rev = "111600b7d063ba42c6543a89f3d3a1d699b6380e" }

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["F722", "E731", "B008", "BLE001", "S110", "RUF009", "S112"]

[tool.ruff.lint.per-file-ignores]
"src/jaxnasium/algorithms/*" = ["PLW0642"]
"src/jaxnasium/envs/pendulum.py" = ["E741"]
"src/jaxnasium/cli/*" = ["RUF059", "F401"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "learn: full algorithm training loops",
    "external: smoke tests for third-party env packages",
    "cli: test the create-rl-app cli tooling",
    "saving_loading: test_saving_loading seperated due to higher python requirement"
]
testpaths = ["tests"]
addopts = "-m 'not learn and not external and not saving_loading'"
